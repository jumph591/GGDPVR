; ============================================================================================================
;  GGDPVR - VR for Gal*Gun: Double Peace - settings
; ============================================================================================================
;  How to use this file:
;   - Change a value after the = sign, save, then start the game. Changes apply the next time the game starts.
;   - Every option shows its installed default as "(default: ...)". Deleting a line also brings back its default.
;   - 1 = on, 0 = off, unless the option says otherwise.
;   - The everyday options come first; [advanced] below holds fine-tuning and troubleshooting options.
; ============================================================================================================

[vr]

; ---- On / off --------------------------------------------------------------------------------------------
; Turn VR on (1) or off (0). With 0 the game runs as normal on your monitor, without uninstalling anything.
; (default: 1)
enabled=1

; ---- Headset ---------------------------------------------------------------------------------------------
; Which VR runtime to use. "system" uses whichever one is active on your PC (Meta Quest Link, SteamVR, Windows
; Mixed Reality, Virtual Desktop, Pimax...), which is right for almost everyone. To force one instead: oculus,
; steamvr, virtualdesktop, or the full path to a runtime's .json file.
; (default: system)
runtime=system
; Play the game's sound through your headset (1), or through your PC's normal sound output (0).
; With Meta's software (Quest Link / Air Link) the headset's own sound device is picked by itself. With SteamVR,
; Steam Link, Virtual Desktop and others the game uses Windows' default output, which they switch to the headset.
; (default: 1)
headset_audio=1
; Use this sound device for the game instead: part of its name as Windows' Sound settings show it (for example:
; Headphones, Steam Streaming, Virtual Desktop). Only needed if the sound doesn't reach your headset by itself.
; Empty = automatic.
; (default: empty)
headset_audio_device=

; ---- VR controllers ----------------------------------------------------------------------------------------
; Use your VR controllers: you aim by pointing, and the buttons work the game. 0 = play with a gamepad or the
; mouse and keyboard instead, while still seeing the game in VR.
; (default: 1)
controllers=1
; The hand you aim and shoot with: right or left. In [controls] below this is your "main" hand, and the other
; one your "off" hand - so switching this swaps the trigger and grip controls between your hands too.
; (default: right)
dominant_hand=right
; Controller vibration when you shoot, get hit, and click in menus.
; (default: 1)
haptics=1
; Which controller button does what: see [controls] below.

; ---- Sight and pop-ups ---------------------------------------------------------------------------------------
; Size of the small spinning ring in the middle of your sight (the aura circle around it keeps its size).
; Smaller makes it easier to aim at far-away girls' weak spots. 1 = as large as the game draws it.
; (default: 0.75)
sight_center_scale=0.75
; Size of the weak-spot pop-ups that appear when your sight is over a girl's weak spot. 1 = the same size compared
; to the girls as on a monitor; 0.5 = half that. They also shrink for girls further away, like the girls do.
; (default: 1)
weak_spot_size=1
; Kiss marks and shoe prints that attacks leave on the screen: 1 = show them, 0 = don't.
; (default: 1)
screen_marks=1

; ---- Comfort -----------------------------------------------------------------------------------------------
; The game shakes its camera when you're hit, and bobs it as you walk along the route. In VR a camera moving on
; its own can make some people feel sick. 1 = take the shake out (your view stays steady), 0 = keep it.
; (defaults: 1, 1)
remove_hit_shake=1
remove_walk_bob=1

; ---- HUD panel and screens ---------------------------------------------------------------------------------
; The game's HUD and menus float on a panel in front of you. Its distance and width, in metres.
; (defaults: 1.6 and 1.8)
ui_distance=1.6
ui_width=1.8
; The flat screen used for the startup logos, the launcher and story CGs / movies: distance and width, in metres.
; (defaults: 2.0 and 2.6)
screen_distance=2.0
screen_width=2.6
; How much of your view full-screen effects cover (fades, flashes, the pink damage edge): 1 = all of it.
; (default: 0.9)
ui_fullscreen_fov=0.9
; The same for the white, flowery "Double Peace" border in Doki-Doki Mode.
; (default: 0.8)
ui_fullscreen_fov_doki=0.8

; ---- Performance -------------------------------------------------------------------------------------------
; The game's moving shadows. Turning them off makes VR much smoother and is hard to notice. Your own setting is
; put back when you quit the game.
; (default: 0)
dynamic_shadows=0
; Also keep showing the game on your PC monitor while you play in VR (costs some frame rate).
; (default: 0)
desktop_mirror=0

; ---- Log file ----------------------------------------------------------------------------------------------
; 1 = keep a log file you can send with a bug report: %LOCALAPPDATA%\GGDPVR\logs\ggdpvr.log (the last 8 game
; sessions are kept, at most 100 MB each). 0 = write no log. GGDPVR-Setup.exe's logging link switches this for you.
; It also records how long each frame took (every few seconds), which helps with stutter or low frame rate reports.
; The log never contains your Windows user name or device names, and is never sent anywhere: it stays on your PC
; until you choose to share it.
; (default: 1)
log=1

; ============================================================================================================
[controls]
; Which VR controller button presses which game button. The defaults are listed under each one.
; ============================================================================================================
;
; Write a controller button as   hand.button   - for example  main.trigger  or  left.button_upper
;
;   hand    main   the hand you aim and shoot with (dominant_hand above - your right hand unless you changed it)
;           off    your other hand
;           left   always the left controller, whichever hand you aim with
;           right  always the right controller
;
;   button  trigger        the trigger under your index finger
;           grip           the grip button under your middle finger (on the side of the handle)
;           stick_click    pushing the thumbstick down until it clicks
;           button_lower   the lower face button: A on the right controller, X on the left one
;           button_upper   the upper face button: B on the right controller, Y on the left one
;           menu           the menu button (three lines). Meta Quest controllers only have it on the left - the
;                          right one's Meta button belongs to the headset and can't be used by games
;
; - To use several controller buttons for one game button, separate them with commas: any of them presses it.
; - One controller button can be listed for several game buttons: it then presses all of them at once.
; - none = that game button isn't on the controllers.
;
; Controllers that are laid out differently:
;   Meta Quest / Rift, HP Reverb G2 ... as described above.
;   Valve Index ...................... A = button_lower, B = button_upper on both controllers;
;                                      menu = press the trackpad down firmly.
;   Windows Mixed Reality ............ press the top half of the round trackpad for button_upper, the bottom
;                                      half for button_lower; both controllers have a menu button.
;   HTC Vive wands ................... the trackpad is the thumbstick; click its top for button_upper, its bottom
;                                      for button_lower, its centre for stick_click. No grip analog: grip = the
;                                      side buttons. Both have a menu button.
;   Steam Frame ...................... right: A = button_lower, B / X / Y = button_upper, Menu = menu;
;                                      left: D-pad down = button_lower, the other D-pad directions =
;                                      button_upper, View = menu.
;   Anything else .................... your VR software (for example SteamVR) shows these controls as one of the
;                                      above and usually lets you rebind them in its own controller settings.
;
; Not set here:
;   - Aiming: you aim by pointing the main hand's controller.
;   - Thumbsticks: the main hand's stick is the gamepad's right stick (moves through lists in menus; turns the
;     camera in the Collection, Dressing Room and story game over). The off hand's stick is the D-pad (choose
;     your route at the arrows, move through menus).
;   - Minigames (helping a stuck girl): you touch her with the zoom button; in the timed "repeat the on-screen
;     commands" part, the shoot and special_requests buttons touch too.

; Pheromone shot (X): shoot the girls; hold it to charge your shot. In menus it clicks what you point at.
; (default: main.trigger)
shoot=main.trigger
; Zoom (RB): look through obstacles and see what you otherwise couldn't.
; (default: main.grip)
zoom=main.grip
; Sight speed (LB): the game's "target moving speed" button.
; (default: off.grip)
sight_speed=off.grip
; Special requests (RT): the game's touch button. In VR the minigames' special requests (the icons on her body)
; are done with the zoom button where you point; this one touches in the minigames' hands-on part and in the
; Collection's Fantasize.
; (default: off.trigger)
special_requests=off.trigger
; Doki-Doki Mode (Y): start Doki-Doki Mode when at least one Heart Gauge is full.
; (default: left.button_upper)
doki_doki_mode=left.button_upper
; "Mom is coming!" (BACK): the game's quick-hide screen.
; (default: left.button_lower)
mom_is_coming=left.button_lower
; Confirm (A) in menus.
; (default: right.button_lower)
confirm=right.button_lower
; Cancel / back (B) in menus.
; (default: right.button_upper)
cancel=right.button_upper
; Pause (START).
; (default: left.menu, right.menu)
pause=left.menu, right.menu
; R3 (pressing the gamepad's right stick down).
; (default: main.stick_click)
r3=main.stick_click
; Re-center: makes the direction you're facing "straight ahead" in the game again (the mod's own button; your
; headset's own re-center works too).
; (default: off.stick_click)
recenter=off.stick_click
; Hide / show the HUD (HP gauge, Heart Gauge, score, the boss's HP) - handy to see a girl up close. This only
; happens in stages and boss fights; there the button does nothing else. Everywhere else it does whatever it is
; set to above (by default this is the cancel button).
; (default: right.button_upper)
hud_toggle=right.button_upper


; ============================================================================================================
[advanced]
; Fine-tuning and troubleshooting. You shouldn't need to change these to play.
; ============================================================================================================

; ---- Aiming ------------------------------------------------------------------------------------------------
; Where shots come from. head = from between your eyes toward where your controller points, so the sight and
; your shots always line up (recommended). hand = straight out of the controller like a laser pointer (shots can
; land a little off the sight, especially up close).
; (default: head)
aim_origin=head
; Steadies the aim against small hand tremors without slowing down fast movements. 0 = off, 2 = strong.
; (default: 1.0)
aim_smoothing=1.0
; Furthest distance (metres) the aim ray reaches; the sight sits on whatever it hits first, up to this far.
; Keep it large - a short distance makes up-close aiming disagree with where shots land.
; (default: 60.0)
reticle_distance=60.0
; Size of the plain ring used as the pointer in menus, in degrees.
; (default: 1.4)
reticle_size=1.4

; ---- World size and image quality ----------------------------------------------------------------------------
; How big the game world feels around you (it sets how far apart your eyes are in the game world and how far
; your head movements move you). Higher = the world and the girls feel smaller.
; (default: 85.0)
world_scale=85.0
; Image sharpness: the game renders at your headset's recommended resolution times this. Above 1 = sharper but
; slower, below 1 = faster but blurrier.
; (default: 1.0)
render_scale=1.0
; While you zoom (Zoom button), the zoomed circle is drawn as a separate sharp view of the scene (1), or as an
; enlarged part of the normal view (0: cheaper, but blurrier).
; (default: 1)
zoom_scope_render=1

; ---- Frame pacing ------------------------------------------------------------------------------------------
; Normally each new frame is shown as soon as it's ready. If your PC can't keep up with your headset's refresh
; rate, frames alternate between shown-once and shown-twice, which some people see as stutter. This option
; shows every frame for exactly the same number of headset refreshes instead - a steady, lower frame rate:
;   0 or 1 = off (as soon as ready)
;   2 = half the refresh rate (e.g. 36 fps on a 72 Hz headset, 45 on 90 Hz, 60 on 120 Hz)
;   3 = a third (24 / 30 / 40 fps), 4 = a quarter, ... up to 6.
; Higher numbers are smoother but less responsive; most people should leave this at 0.
; (default: 0)
frame_hold_slots=0

; ---- Weak-spot pop-ups -------------------------------------------------------------------------------------
; Weak-spot pop-ups keep their full size up to this distance (metres) from you, then shrink like the girl does...
; (default: 1.5)
weak_spot_full_size_m=1.5
; ...but never below this share of their full size.
; (default: 0.3)
weak_spot_min_size=0.3

; ---- Minigames ---------------------------------------------------------------------------------------------
; In the minigames (helping a girl who's stuck), the panel is this much bigger, so request icons further out on
; her body stay on it.
; (default: 1.3)
minigame_panel_scale=1.3
; The minigame panel follows where you look up and down. It moves as soon as you look away from its centre (0),
; or only once you look more than this many degrees away from it.
; (default: 0)
minigame_follow_deadzone=0
; Degrees below eye level the minigame panel starts at.
; (default: 0)
minigame_panel_drop=0
; Swipe requests: your hand movement counts this many times over (the game expects a fast, long swipe).
; (default: 1.5)
minigame_flick_gain=1.5
; Special requests count when you touch anywhere while one is showing, like the game (0); or only within this
; distance of the request's icon (e.g. 150).
; (default: 0)
minigame_request_radius=0

; ---- Title screen ------------------------------------------------------------------------------------------
; How much the title screen's girls turn to face you: 0 = facing straight ahead, 1 = facing you.
; (default: 1.3)
title_face_player=1.3
; The front group of girls: moved this many metres to the right (negative = left), and back.
; (defaults: 0.1 and 0.75)
title_front_right=0.1
title_front_push=0.75

; ---- Special scenes ----------------------------------------------------------------------------------------
; Doki-Doki Mode's "Double Peace" border: the part along the bottom (the flowers) kept in its true shape, as a
; share of its height; the white glow above stretches to fill the rest. 0 = the whole border stretched to fit.
; (default: 0)
ui_doki_flower_band=0
; Story game over: your eye height above the girl's feet and your distance from her (game units; 0 = the game's
; own camera), and how far above (+) or below (-) your eyes she looks.
; (defaults: 130, 130, -15)
gameover_height=130
gameover_distance=130
gameover_gaze_offset=-15
; Dressing Room: how far you stand from the girl, in metres (0 = the game's own camera position).
; (default: 4.5)
dressing_distance=4.5


